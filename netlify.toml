[build]
  command = "npm run build"
  publish = "build"
  # 15 nov 2026: cada publicación cuesta 15 créditos de Netlify (bolsa
  # compartida con Balancet). Un commit que no toca la web (reglas de
  # Firebase, functions/ de Firebase, README) ya no se publica: «Skipped».
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- src public config scripts package.json package-lock.json netlify.toml"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/presentacion_porra.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/intro.mp3"
  [headers.values]
    Cache-Control = "public, max-age=86400"
